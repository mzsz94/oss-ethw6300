description: Wiznet W6300 Ethernet Controller

compatible: "wiznet,w6300"

include: spi-device.yaml

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: Interrupt GPIO pin

  reset-gpios:
    type: phandle-array
    required: false
    description: Reset GPIO pin

  io2-gpios:
    type: phandle-array
    required: false
    description: IO2 GPIO pin (QSPI data 2)

  io3-gpios:
    type: phandle-array
    required: false
    description: IO3 GPIO pin (QSPI data 3)
